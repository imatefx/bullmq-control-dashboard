name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Unit + integration (coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm -w server run typecheck
      # Integration tests start Redis with Testcontainers (Docker is available on ubuntu runners).
      - run: npm run coverage
      - name: Coverage summary
        if: always() && hashFiles('server/coverage/coverage-summary.json') != ''
        run: |
          node -e "const t=require('./server/coverage/coverage-summary.json').total;
          const row=k=>'| '+k+' | '+t[k].pct+'% |';
          console.log(['| Metric | Coverage |','|---|---|',...['lines','statements','functions','branches'].map(row)].join('\n'))" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: server/coverage
          if-no-files-found: ignore

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_DEBUG: '1' # stream server output into the job log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck:e2e
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
